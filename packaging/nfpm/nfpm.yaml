name: mechanix-browser
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Minesh Purohit <mineshp@mechasystems.com>"
description: Browser for Mechanix OS
homepage: https://github.com/mecha-org/mechanix-browser.git
license: BSD

contents:
  - src: ./stage/bundle/mechanix_browser
    dst: /usr/share/mechanix/mechanix-browser/mechanix_browser
    file_info:
      mode: 0755
  - src: ./stage/bundle/lib
    dst: /usr/share/mechanix/mechanix-browser/lib
  - src: ./stage/bundle/data
    dst: /usr/share/mechanix/mechanix-browser/data
  - src: ./packaging/nfpm/scripts/launcher.sh
    dst: /usr/bin/mechanix_browser
    file_info:
      mode: 0755
  - src: ./org.mechanix.browser.desktop
    dst: /usr/share/applications/org.mechanix.browser.desktop
  - src: ./assets/desktop_icon.png
    dst: /usr/share/icons/hicolor/48x48/apps/org.mechanix.browser.png

scripts:
  postinstall: ./packaging/nfpm/scripts/postinstall.sh
  postremove: ./packaging/nfpm/scripts/postremove.sh
